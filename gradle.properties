org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Compilaciones mas rapidas: solo se rehace lo que cambio y se reutiliza la
# cache entre ejecuciones. Importa ahora que R8 corre en cada release.
org.gradle.caching=true
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Actualizaciones automaticas
#
# Usuario y repositorio de GitHub donde se publican las versiones, en formato
# "usuario/repositorio". La app consulta la ultima Release publicada ahi y, si
# hay una version mas nueva que la instalada, ofrece descargarla.
#
# Dejalo vacio para desactivar la busqueda de actualizaciones.
# ---------------------------------------------------------------------------
playmix.repo=

# ---------------------------------------------------------------------------
# SERVIDORES
#
# Antes esta lista vivia dentro de Servers.kt. Ahora esta aca, asi que agregar
# un "Sistema XXL" o cambiar una direccion no toca ni una linea de Kotlin.
#
# Formato - un servidor por bloque, separados por ";":
#
#   id | etiqueta | url | preferidas_canales | preferidas_ppv | preferidas_pelis
#
#   id .................. clave interna, estable. NO la cambies una vez publicada:
#                         es lo que usa el codigo para reconocer al servidor.
#   etiqueta ............ lo unico que ve el usuario. La URL nunca se muestra.
#   url ................. base del panel Xtream, sin barra final.
#   preferidas_* ........ carpetas que se abren primero en cada seccion, separadas
#                         por comas. Se comparan sin acentos ni mayusculas.
#                         Se pueden dejar vacias.
#
# Los ultimos tres campos son opcionales: se pueden omitir de derecha a izquierda.
#
# Para NO dejar las direcciones en un repositorio publico, borra el valor de aca
# y pasalo en la compilacion:
#     ./gradlew assembleRelease -Pplaymix.servers="id|Etiqueta|http://..."
# El workflow release.yml ya lo hace solo si existe el secret PLAYMIX_SERVERS.
# ---------------------------------------------------------------------------
playmix.servers=\
  l|Sistema L|http://xdplayer.tv:8080|cinema hd hq|sudamericano,sudamericana|vod estrenos,estrenos;\
  xl|Sistema XL|http://moontools.site:8080|cinema latino|chile primera|2026

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
