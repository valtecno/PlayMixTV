name: Compilar APK PlayMix TV

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Esto te permite presionar un botón para compilar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4

    - name: 2. Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Versión estándar para Android actual
        distribution: 'temurin'
        cache: gradle

    - name: 3. Dar permisos al compilador
      run: chmod +x ./gradlew

    - name: 4. Compilar el archivo APK
      run: ./gradlew assembleDebug

    - name: 5. Guardar y entregar el APK listo
      uses: actions/upload-artifact@v4
      with:
        name: PlayMixTV-App
        path: app/build/outputs/apk/debug/app-debug.apk