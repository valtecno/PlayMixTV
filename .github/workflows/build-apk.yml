name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # también podés lanzarlo a mano desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK (debug, listo para instalar)
        # --no-daemon a secas escupe la pila interna de Gradle y entierra el
        # error real. Con estas opciones el motivo sale en claro al final.
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode=all

      # Si falla, esto deja a la vista SOLO las líneas que importan
      - name: Resumen del error
        if: failure()
        run: |
          echo "Si el fallo es de Kotlin, busca líneas que empiecen por 'e:'."
          echo "Si es de recursos, busca 'AAPT' o 'error:'."
          find . -name "*.txt" -path "*build*" 2>/dev/null | head -20

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PlayMixTV-apk
          path: app/build/outputs/apk/debug/*.apk
