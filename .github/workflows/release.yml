name: Publicar versión automática

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      # Genera una versión única para cada push.
      # Ejemplo: 1.0.25
      - name: Generar versión
        run: |
          VERSION="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV

          echo "Versión: $VERSION"
          echo "Version Code: $VERSION_CODE"
          echo "Tag: v$VERSION"

      - name: Ejecutar tests
        run: |
          ./gradlew test --no-daemon

      - name: Preparar keystore
        run: |
          echo "${{ secrets.PLAYMIX_KEYSTORE_BASE64 }}" | base64 --decode > playmix-release.keystore

      - name: Compilar APK Release firmado
        env:
          PLAYMIX_KEYSTORE: ${{ github.workspace }}/playmix-release.keystore
          PLAYMIX_STORE_PASSWORD: ${{ secrets.PLAYMIX_STORE_PASSWORD }}
          PLAYMIX_KEY_ALIAS: ${{ secrets.PLAYMIX_KEY_ALIAS }}
          PLAYMIX_KEY_PASSWORD: ${{ secrets.PLAYMIX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=$VERSION \
            -PversionCode=$VERSION_CODE \
            --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p release

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "release/PlayMixTV-$VERSION.apk"

          ls -lh release

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PlayMix TV ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            release/PlayMixTV-${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}