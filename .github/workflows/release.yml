name: Publicar versión

# Se dispara al empujar un tag de versión: git tag v1.1 && git push origin v1.1
# También se puede lanzar a mano desde la pestaña "Actions".
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (por ejemplo 1.1)'
        required: true

permissions:
  contents: write   # necesario para crear la Release

jobs:
  publicar:
    runs-on: ubuntu-latest

    # Los secrets no se pueden consultar desde un "if:" de un step, así que se
    # copian acá: en el env del job sí se pueden leer. Es lo que permite que el
    # workflow funcione igual en un fork que no tenga los secrets cargados.
    env:
      KEYSTORE_B64: ${{ secrets.PLAYMIX_KEYSTORE_BASE64 }}
      SERVERS: ${{ secrets.PLAYMIX_SERVERS }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Calcular la versión
        id: version
        run: |
          # Del tag "v1.1" sale versionName 1.1. El versionCode tiene que crecer
          # siempre, así que se usa el número de ejecución del workflow.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NOMBRE="${{ github.event.inputs.version }}"
          else
            NOMBRE="${GITHUB_REF_NAME#v}"
          fi
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "codigo=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Publicando versión $NOMBRE (code ${{ github.run_number }})"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3

      # Una versión no se publica si los tests están en rojo. Corren en la JVM,
      # tardan segundos, y cubren justo lo que rompe en silencio: comparación de
      # versiones del propio actualizador, filtros y lista de servidores.
      - name: Correr los tests
        run: ./gradlew test --no-daemon

      # El keystore va en los secrets en base64:
      #   base64 -w0 playmix.jks   (macOS: base64 -i playmix.jks)
      # y se pega el resultado en el secret PLAYMIX_KEYSTORE_BASE64.
      - name: Restaurar el keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/playmix.jks"

      # Si existe el secret PLAYMIX_SERVERS, la lista de servidores sale de ahí
      # y las direcciones reales nunca quedan escritas en el repositorio.
      # Si no existe, se usa la de gradle.properties y todo sigue igual.
      - name: Elegir la lista de servidores
        id: servidores
        run: |
          if [ -n "$SERVERS" ]; then
            echo "arg=-Pplaymix.servers=$SERVERS" >> "$GITHUB_OUTPUT"
            echo "Usando la lista de servidores del secret."
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
            echo "Usando la lista de gradle.properties."
          fi

      - name: Compilar el APK firmado
        env:
          PLAYMIX_KEYSTORE: ${{ runner.temp }}/playmix.jks
          PLAYMIX_STORE_PASSWORD: ${{ secrets.PLAYMIX_STORE_PASSWORD }}
          PLAYMIX_KEY_ALIAS: ${{ secrets.PLAYMIX_KEY_ALIAS }}
          PLAYMIX_KEY_PASSWORD: ${{ secrets.PLAYMIX_KEY_PASSWORD }}
          # Se pasan como variables de entorno (no interpoladas a mano en el
          # texto del comando) justamente para no repetir el bug que rompió
          # este paso: mezclar "${{ }}" con continuaciones de línea "\" es
          # frágil -un espacio de más después de la barra invertida corta el
          # comando ahí mismo- y terminó mandándole a Gradle "3.0" como si
          # fuera el nombre de una tarea en vez de como valor de -PversionName.
          VERSION_NAME: ${{ steps.version.outputs.nombre }}
          VERSION_CODE: ${{ steps.version.outputs.codigo }}
          REPO_ARG: ${{ github.repository }}
          SERVERS_ARG: ${{ steps.servidores.outputs.arg }}
        run: |
          # Arreglo en vez de una sola línea larga: así, si SERVERS_ARG viene
          # vacío (no hay secret PLAYMIX_SERVERS cargado), simplemente no se
          # agrega ningún argumento -en vez de mandarle a Gradle un "" suelto,
          # que es otra forma de que interprete cualquier cosa como tarea.
          args=(
            assembleRelease --no-daemon
            "-PversionName=$VERSION_NAME"
            "-PversionCode=$VERSION_CODE"
            "-Pplaymix.repo=$REPO_ARG"
          )
          if [ -n "$SERVERS_ARG" ]; then
            args+=("$SERVERS_ARG")
          fi
          echo "Ejecutando: ./gradlew ${args[*]}"
          ./gradlew "${args[@]}"

      - name: Renombrar el APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "PlayMixTV-${{ steps.version.outputs.nombre }}.apk"

      # El APK de release va minificado y ofuscado por R8. Sin este mapping,
      # un stack trace que reporte un usuario es ilegible: los nombres de clase
      # y método aparecen como a(), b(), c(). Se guarda como artifact del
      # workflow (privado), NO se adjunta a la Release pública.
      - name: Guardar el mapping de R8
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.nombre }}
          path: app/build/outputs/mapping/release/
          retention-days: 90

      # La app lee ESTA Release. Los "artifacts" del otro workflow no sirven:
      # solo se descargan autenticado, así que la app no puede acceder a ellos.
      - name: Publicar la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PlayMix TV ${{ steps.version.outputs.nombre }}
          generate_release_notes: true
          files: PlayMixTV-${{ steps.version.outputs.nombre }}.apk
